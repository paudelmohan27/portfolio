<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Link preview card</title>
<!-- Source for public/og-image.jpg (1200×630). Render it with a headless browser at that size. -->
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    font-family: 'Geist', Arial, sans-serif; color: #0E1116;
    background: linear-gradient(180deg, #CBD5FF 0%, #E8ECFB 60%, #F4F5FA 100%);
  }
  .ghost {
    position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
    font-size: 210px; font-weight: 700; letter-spacing: -0.05em; color: #FFFFFF; opacity: 0.75; white-space: nowrap;
  }
  .brand { position: absolute; top: 56px; left: 72px; display: flex; align-items: center; gap: 14px; font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  .mark { width: 48px; height: 48px; border-radius: 13px; background: #3451F5; color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Geist Mono', monospace; font-size: 20px; }
  .text { position: absolute; left: 72px; top: 150px; width: 640px; }
  h1 { margin: 0; font-size: 84px; line-height: 0.98; font-weight: 600; letter-spacing: -0.045em; }
  h1 span { color: #3451F5; }
  p { margin: 22px 0 0; font-size: 26px; line-height: 1.4; color: #565C6B; }
  .url { position: absolute; left: 72px; bottom: 56px; display: inline-flex; align-items: center; height: 56px; padding: 0 26px; border-radius: 999px; background: #0E1116; color: #fff; font-size: 24px; font-weight: 500; }
  .arch {
    position: absolute; right: 80px; bottom: 0; width: 360px; height: 470px; border-radius: 180px 180px 0 0;
    background: linear-gradient(180deg, #3451F5 0%, #7C93FF 100%); overflow: hidden; display: flex; justify-content: center; align-items: flex-end;
  }
  .arch img { height: 94%; width: auto; }
  .tag { position: absolute; background: #fff; border-radius: 999px; padding: 10px 20px; font-size: 22px; box-shadow: 0 10px 30px rgba(52,81,245,0.18); }
</style>
</head>
<body>
  <div class="ghost">&lt;builder/&gt;</div>
  <div class="brand"><span class="mark">m/</span>Mohan Paudel</div>
  <div class="text">
    <h1>Computer engineer &amp; <span>web developer</span></h1>
    <p>Full-stack web apps with React and Node.<br>Problem solving in C++.</p>
  </div>
  <div class="url">paudelmohan.com.np</div>
  <div class="arch"><img src="../public/mohan.webp" alt=""></div>
  <div class="tag" style="right: 380px; top: 200px; transform: rotate(-12deg);">React &amp; Node</div>
  <div class="tag" style="right: 60px; top: 150px; transform: rotate(10deg);">C++</div>
</body>
</html>
